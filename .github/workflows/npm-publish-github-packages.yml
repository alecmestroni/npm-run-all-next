name: CI, Coverage & Publish

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - labeled
      - unlabeled
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      runTest:
        description: 'Run tests'
        required: false
        default: false
        type: boolean
      runPublish:
        description: 'Run publish'
        required: false
        default: false
        type: boolean

jobs:
  pr-test-release:
    if: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'Test release') && github.event.pull_request.head.repo.full_name == github.repository }}
    name: PR Test Release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Ensure npm token exists
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "❌ NPM_TOKEN is missing. Cannot publish test release."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build unique prerelease version
        id: prerelease
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          BASE_VERSION=$(node -p "require('./package.json').version")
          PR_NUMBER="${{ github.event.pull_request.number }}"
          RUN_NUMBER="${{ github.run_number }}"
          CANDIDATE_VERSION="${BASE_VERSION}-test.pr${PR_NUMBER}.${RUN_NUMBER}"

          echo "package_name=$PACKAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$CANDIDATE_VERSION" >> "$GITHUB_OUTPUT"
          echo "Candidate prerelease: $PACKAGE_NAME@$CANDIDATE_VERSION"

      - name: Check prerelease version availability
        run: |
          PACKAGE_NAME="${{ steps.prerelease.outputs.package_name }}"
          CANDIDATE_VERSION="${{ steps.prerelease.outputs.version }}"

          if npm view "$PACKAGE_NAME@$CANDIDATE_VERSION" version >/dev/null 2>&1; then
            echo "❌ Version $CANDIDATE_VERSION is already published."
            exit 1
          fi

          echo "✅ Version $CANDIDATE_VERSION is available"

      - name: Set package version (no git tag)
        run: npm pkg set version="${{ steps.prerelease.outputs.version }}"

      - name: Lint & pre-test
        run: npm run pretest

      - name: Run optimized tests (no coverage)
        run: |
          CORES=$(node -p "require('os').cpus().length")
          if [ "$CORES" -gt 4 ]; then
            CONCURRENCY=4
          else
            CONCURRENCY=$CORES
          fi
          echo "Using $CONCURRENCY workers on $CORES cores"
          TEST_CONCURRENCY=$CONCURRENCY npm run test:parallel

      - name: "Publish prerelease to npm (tag: test)"
        run: npm publish --tag test

      - name: Comment on PR with prerelease info
        uses: actions/github-script@v7
        with:
          script: |
            const version = `${{ steps.prerelease.outputs.version }}`
            const pkg = `${{ steps.prerelease.outputs.package_name }}`
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: [
                '✅ Test release published before merge.',
                '',
                `Package: \`${pkg}\``,
                `Version: \`${version}\``,
                'Install command:',
                `\`npm i ${pkg}@${version}\`'
              ].join('\n')
            })

  check-version:
    if: ${{ (github.event_name == 'pull_request' || inputs.runTest == true) && (github.event_name != 'pull_request' || (!contains(github.event.pull_request.labels.*.name, 'skip-version') && !contains(github.event.pull_request.labels.*.name, 'Test release'))) }}
    name: Check Version Publishable
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check if version is already published
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          echo "Checking if $PACKAGE_NAME@$PACKAGE_VERSION is already published..."
          if npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version 2>/dev/null; then
            echo "❌ Error: Version $PACKAGE_VERSION is already published on npm!"
            echo "Please bump the version in package.json before merging."
            exit 1
          else
            echo "✅ Version $PACKAGE_VERSION is available for publishing"
          fi

  test-and-coverage:
    if: ${{ always() && (github.event_name == 'pull_request' || inputs.runTest == true) && (needs.check-version.result == 'success' || needs.check-version.result == 'skipped') && (github.event_name != 'pull_request' || !contains(github.event.pull_request.labels.*.name, 'Test release')) }}
    name: Test & Coverage
    runs-on: ubuntu-latest
    needs: check-version
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Lint & Pre-test
        run: npm run pretest

      - name: Run tests
        run: |
          CORES=$(node -p "require('os').cpus().length")
          if [ "$CORES" -gt 4 ]; then
            CONCURRENCY=4
          else
            CONCURRENCY=$CORES
          fi
          echo "Using $CONCURRENCY workers on $CORES cores"
          TEST_CONCURRENCY=$CONCURRENCY npm run test:parallel:coverage

      - name: Print Coverage
        run: npm run coverage:report

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          flags: unittests
          name: codecov-coverage
          fail_ci_if_error: true

  publish-gpr:
    if: ${{ github.event_name == 'push' || inputs.runPublish == true }}
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Get PR number
        id: pr
        if: github.event_name == 'push'
        run: |
          PR_NUMBER=$(gh pr list --search "${{ github.sha }}" --state merged --json number --jq '.[0].number')
          echo "number=$PR_NUMBER" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ github.token }}
      
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      
      - run: npm ci
      
      - name: Publish package
        id: publish
        run: |
          npm publish
          echo "success=true" >> $GITHUB_OUTPUT
        continue-on-error: true
      
      - name: Comment on PR - Success
        if: steps.pr.outputs.number && steps.publish.outputs.success == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ steps.pr.outputs.number }},
              body: '🎉 Package published successfully to npm!\n\nPublished version: `' + require('./package.json').version + '`\n\n✅ Available at: https://www.npmjs.com/package/npm-run-all-next'
            })
      
      - name: Comment on PR - Failure
        if: steps.pr.outputs.number && steps.publish.outputs.success != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ steps.pr.outputs.number }},
              body: '❌ Package publication to npm failed.\n\nCheck the action logs for more details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
            })
      
      - name: Fail if publish failed
        if: steps.publish.outputs.success != 'true'
        run: exit 1

